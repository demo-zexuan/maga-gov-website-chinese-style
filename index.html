<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      响应式视口：站点在 ≥1400px 时保持参考图的定宽桌面版式，
      以下则逐级自适应（平板折叠侧栏、手机单列 + 汉堡导航）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bd0000" />
    <meta name="format-detection" content="telephone=no" />
    <title>美利坚合众国网上便民服务中心 | United States Public Convenience Service Portal</title>
    <meta
      name="description"
      content="人民至上 · 服务全民 · 高效便捷 · 让美国更强大。本站为纯娱乐讽刺作品，不包含任何政治倾向，所有数据均为虚构。"
    />
    <meta name="keywords" content="网上便民服务中心,一网通办,让美国再次伟大,搞笑,讽刺,演示站点" />
    <!-- 古早风格必备：网站徽标作为 favicon（内联 SVG，无需额外请求） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23bd0000' stroke='%23f5c542' stroke-width='4'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f5c542' font-family='serif'%3E%E2%98%85%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* 首屏骨架：在 JS 加载完成前先给出站点的米灰底色，避免白色闪屏破坏古早质感 */
      html,
      body {
        margin: 0;
        background: #e9e9e9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: SimSun, serif">

      </div>

    <script type="module" src="/src/main.tsx"></script>
